; PlatformIO project for deskmate
; Three board targets, all a 1.54" 240x240 ST7789 IPS display:
;   env:deskmate       GeekMagic DeskMate,  ESP-12F (ESP8266)
;   env:deskmate_c2    knockoff DeskMate,   ESP32-C2 / ESP8684 (flashed over USB-C/CH340C)
;   env:deskmate_esp32 NMMiner NM-TV-154,  classic ESP32 (WROOM-32E)
;
; Build one:       pio run -e deskmate   /  pio run -e deskmate_c2  /  pio run -e deskmate_esp32
; 160 MHz (8266):  uncomment the board_build.f_cpu line below
; Build artifacts: .pio/build/<env>/firmware.bin and firmware-<version>.bin
; Flash via USB:   pio run -e <env> -t upload
; Flash via OTA:   upload firmware.bin through the device web UI (Update tab)
;
; License: WTFPL

[platformio]
default_envs = deskmate

; Every environment keeps PlatformIO's standard firmware filename and also
; emits a versioned copy such as firmware-4.7.2.bin.
[env]
extra_scripts = post:scripts/versioned_artifact.py

[env:deskmate]
platform = espressif8266
board = esp12e
framework = arduino

; ESP-12F on the DeskMate carries 4MB flash. Layout: 1MB LittleFS, rest for
; sketch + OTA (OTA needs room for two sketch copies).
; CPU defaults to 80 MHz. Uncomment the line below to build at 160 MHz.
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

monitor_speed = 115200
upload_speed = 921600

; Low-memory lwIP leaves more heap for HTTPS, the web server, and tiled rendering.
; BearSSL elliptic-curve support is pinned to P-256 in src/platform/BearSslTuning.cpp to keep
; secure API requests predictable on the memory-constrained ESP8266.
; Compiler defaults to -Os (optimize for size). Uncomment -O2 below for speed.
build_flags =
	-D DESKMATE_ESP8266
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0
	-Os
	; -O2

; Feature folders on the include path so cross-module quote-includes resolve.
; These MUST be build_src_flags (project sources only), not build_flags — a global
; -Isrc leaks into the framework build and, on the ESP32 IDF, shadows internal
; headers like net.h/config.h (case-insensitively on Windows), breaking the build.
build_src_flags =
	-iquote src
	-iquote src/app
	-iquote src/boards
	-iquote src/boot
	-iquote src/core
	-iquote src/display
	-iquote src/ota
	-iquote src/platform
	-iquote src/web
	-iquote src/features/radar
	-iquote src/features/weather
	-iquote src/features/network
	-iquote src/features/github

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0
	adafruit/Adafruit GFX Library @ ^1.11.11

; One firmware image ships the four desk-dashboard features. Optional local
; slim builds can disable weather/network/radar/GitHub with WITH_* build flags.

; ---------------------------------------------------------------------------
; Minimal OTA loader (src/boot/loader.cpp). A tiny WiFi + web-OTA image, small
; enough to slip through a stock firmware whose updater rejects the full image
; for lack of space (e.g. the GeekMagic DeskMate-ultra). Flash it over the stock
; OTA, then flash the real firmware over the loader's /update. Pass WiFi at
; build time: -DLOADER_SSID='"MyNet"' -DLOADER_PASS='"secret"' (else it opens a
; DeskMate-Loader AP). build_src_filter compiles ONLY the loader.
; ---------------------------------------------------------------------------
[env:deskmate_loader]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
	-D LOADER_BUILD
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_filter = -<*> +<boot/loader.cpp>

; ---------------------------------------------------------------------------
; ESP32-C2 / ESP8684 knockoff. Official espressif32 doesn't support the C2, so
; use the pioarduino fork (Arduino core 3.x / ESP-IDF 5.x). 4 MB flash: two OTA
; app slots + ~0.9 MB LittleFS (see partitions/deskmate_4mb_ota.csv). Flashed over
; the onboard CH340C on the USB-C port (auto-reset works, no button needed).
; CPU defaults to 80 MHz. Available: 40, 80, 120 MHz.
; board_build.f_cpu = 120000000L
; ---------------------------------------------------------------------------
[env:deskmate_c2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c2-devkitm-1
framework = arduino

board_build.filesystem = littlefs
board_build.partitions = partitions/deskmate_4mb_ota.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; PlatformIO's bundled esptool hangs entering download mode on this board's CH340C.
; Flash the merged image with the system esptool instead (its auto-reset works).
; Needs a system Python with esptool installed (`pip install esptool`).
upload_protocol = custom
upload_command = python -m esptool --chip esp32c2 --baud 921600 write_flash 0x0 "$BUILD_DIR/firmware.factory.bin"

build_flags =
	-D DESKMATE_ESP32C2
	-D ARDUINOJSON_USE_DOUBLE=0
	-Os
	; -O2

build_src_flags =
	-iquote src
	-iquote src/app
	-iquote src/boards
	-iquote src/boot
	-iquote src/core
	-iquote src/display
	-iquote src/ota
	-iquote src/platform
	-iquote src/web
	-iquote src/features/radar
	-iquote src/features/weather
	-iquote src/features/network
	-iquote src/features/github

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0
	adafruit/Adafruit GFX Library @ ^1.11.11

; ---------------------------------------------------------------------------
; NMMiner NM-TV-154 ("NM-TV-Miner" PCB): classic ESP32 (ESP32-D0WD-V3 in a
; WROOM-32E, 40 MHz crystal), same 1.54" ST7789 panel. Confirmed working on
; hardware by a community tester (issue #1); pin map from the vendor's
; custom-firmware guide. Same pioarduino platform as the C2 so both ESP32
; targets get Arduino core 3.x (Platform.h's ESP32 branch needs it). 4 MB
; flash (confirmed): same two-OTA-slots + LittleFS layout as the C2.
; First flash over USB: esptool write_flash 0x0 firmware.factory.bin
; CPU defaults to 240 MHz. Available: 80, 160, 240 MHz.
; board_build.f_cpu = 160000000L
; ---------------------------------------------------------------------------
[env:deskmate_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.filesystem = littlefs
board_build.partitions = partitions/deskmate_4mb_ota.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

build_flags =
	-D DESKMATE_ESP32
	-D ARDUINOJSON_USE_DOUBLE=0
	-Os
	; -O2

build_src_flags =
	-iquote src
	-iquote src/app
	-iquote src/boards
	-iquote src/boot
	-iquote src/core
	-iquote src/display
	-iquote src/ota
	-iquote src/platform
	-iquote src/web
	-iquote src/features/radar
	-iquote src/features/weather
	-iquote src/features/network
	-iquote src/features/github

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0
	adafruit/Adafruit GFX Library @ ^1.11.11
