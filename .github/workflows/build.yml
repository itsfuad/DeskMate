name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  icons:
    # src/display/IconData.* are generated from the Icon:: identifiers used in
    # src/ and committed. This fails the build if the two drift apart. It reads
    # only committed files, so it needs no rasterizer and no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python3 scripts/gen_icons.py --check

  esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - run: pio run -e deskmate
      - uses: actions/upload-artifact@v4
        with:
          name: deskmate-esp8266-firmware
          path: .pio/build/deskmate/firmware.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: esp8266
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deskmate-esp8266-firmware
          path: release
          merge-multiple: true
      - name: Name firmware artifact
        run: mv release/firmware.bin "release/deskmate-${GITHUB_REF_NAME}-esp8266.bin"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="release/deskmate-${GITHUB_REF_NAME}-esp8266.bin"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --generate-notes --title "DeskMate $GITHUB_REF_NAME"
          fi
