name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  icons:
    # src/display/IconData.* are generated from the Icon:: identifiers used in
    # src/ and committed. This fails the build if the two drift apart. It reads
    # only committed files, so it needs no rasterizer and no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python3 scripts/gen_icons.py --check

  esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Install icon rasterizer dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: pip install platformio pillow
      - run: pio run -e deskmate
      - name: Verify generated icons are committed
        run: python3 scripts/gen_icons.py --check
      - name: Preserve exact binary and ELF from this build
        run: |
          python3 scripts/preserve_firmware.py --source .pio/build/deskmate --output firmware-artifacts
          pio pkg list -e deskmate > firmware-artifacts/packages.txt
          tar -czf deskmate-esp8266-debug.tar.gz -C firmware-artifacts .
          mv deskmate-esp8266-debug.tar.gz firmware-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: deskmate-esp8266-firmware
          path: |
            firmware-artifacts/firmware.bin
            firmware-artifacts/deskmate-esp8266-debug.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: esp8266
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deskmate-esp8266-firmware
          path: release
          merge-multiple: true
      - name: Name firmware artifact
        run: mv release/firmware.bin "release/deskmate-${GITHUB_REF_NAME}-esp8266.bin"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="release/deskmate-${GITHUB_REF_NAME}-esp8266.bin"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" release/deskmate-esp8266-debug.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" release/deskmate-esp8266-debug.tar.gz --verify-tag --generate-notes --title "DeskMate $GITHUB_REF_NAME"
          fi
